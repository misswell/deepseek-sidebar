<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeepSeek Sidebar</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, sans-serif; display: flex; flex-direction: column; }

    #toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 36px;
      padding: 0 8px;
      background: #1a1a2e;
      border-bottom: 1px solid #16213e;
      flex-shrink: 0;
      user-select: none;
    }

    .app-switcher {
      display: flex;
      align-items: center;
      gap: 2px;
      min-width: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .app-switcher::-webkit-scrollbar { display: none; }

    .app-btn {
      width: 28px;
      height: 28px;
      border: 2px solid transparent;
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, border-color 0.15s;
      padding: 0;
    }

    .app-btn:hover { background: #2a2a4a; }
    .app-btn.active { border-color: rgba(255,255,255,0.5); background: #2a2a4a; }

    .app-btn img {
      width: var(--icon-size, 20px);
      height: var(--icon-size, 20px);
      border-radius: 3px;
      object-fit: contain;
      display: block;
    }

    .app-btn[data-app="qianwen"] img { --icon-size: 18px; }
    .app-btn[data-app="gemini"] img { --icon-size: 21px; }
    .app-btn[data-app="youdao"] img { --icon-size: 20px; }

    .zoom-controls {
      display: flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }

    .zoom-controls button {
      width: 26px;
      height: 26px;
      border: none;
      border-radius: 4px;
      background: transparent;
      cursor: pointer;
      font-size: 15px;
      color: #aaa;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
    }

    .zoom-controls button:hover { background: #2a2a4a; color: #fff; }
    .zoom-controls button:active { background: #3a3a5a; }

    #zoom-label {
      font-size: 11px;
      color: #999;
      min-width: 36px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    #webview-container {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      position: relative;
      background: #fff;
    }

    .webview-frame {
      position: absolute;
      top: 0; left: 0;
      border: none;
      transform-origin: 0 0;
      width: 100%;
      height: 100%;
      /* visibility handled by JS */
    }

    .webview-frame.hidden { display: none; }

    .harness-bridge-status {
      min-height: 15px;
      margin-top: 10px;
      max-width: 100%;
      padding: 4px 8px;
      border: 1px solid rgba(15, 23, 42, 0.12);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      color: #64748b;
      font-size: 10px;
      line-height: 1.2;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.16s ease;
    }

    .harness-bridge-status.visible { opacity: 1; }
    .harness-bridge-status.error { color: #be123c; }
    .harness-bridge-status.working { color: #0369a1; }
    .harness-bridge-status.done { color: #047857; }

    .harness-panel {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      padding: 16px 14px 24px;
      background: #0b1118;
      color: #e5edf5;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .harness-panel.hidden { display: none; }

    .harness-hero {
      position: relative;
      overflow: hidden;
      padding: 16px;
      border: 1px solid #1f3b45;
      border-radius: 14px;
      background:
        radial-gradient(circle at 92% 8%, rgba(61, 227, 177, 0.18), transparent 35%),
        linear-gradient(145deg, #10232b 0%, #0c151d 68%);
      box-shadow: 0 16px 30px rgba(0, 0, 0, 0.18);
    }

    .harness-hero::after {
      content: '';
      position: absolute;
      right: -32px;
      bottom: -48px;
      width: 150px;
      height: 150px;
      border: 1px solid rgba(110, 231, 183, 0.16);
      border-radius: 50%;
      box-shadow: 0 0 0 14px rgba(110, 231, 183, 0.04), 0 0 0 28px rgba(110, 231, 183, 0.025);
      pointer-events: none;
    }

    .harness-kicker {
      color: #6ee7b7;
      font: 10px/1.2 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .harness-hero h1 {
      max-width: 260px;
      margin-top: 8px;
      color: #f5fbff;
      font-size: 22px;
      line-height: 1.1;
      letter-spacing: -0.04em;
    }

    .harness-hero p {
      max-width: 320px;
      margin-top: 8px;
      color: #9eb2be;
      font-size: 12px;
      line-height: 1.55;
    }

    .harness-connection {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 14px;
      color: #a9c4cc;
      font-size: 11px;
    }

    .harness-state {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .harness-state-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #f59e0b;
      box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.12);
    }

    .harness-state.connected .harness-state-dot {
      background: #6ee7b7;
      box-shadow: 0 0 0 4px rgba(110, 231, 183, 0.12);
    }

    .harness-state.error .harness-state-dot {
      background: #fb7185;
      box-shadow: 0 0 0 4px rgba(251, 113, 133, 0.12);
    }

    .harness-endpoint-row {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
    }

    .harness-endpoint {
      min-width: 0;
      flex: 1;
      overflow: hidden;
      color: #b9d6df;
      font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .harness-panel button {
      border: 1px solid #29434e;
      border-radius: 7px;
      padding: 7px 10px;
      background: #142932;
      color: #d7edf1;
      cursor: pointer;
      font: 11px -apple-system, BlinkMacSystemFont, sans-serif;
      transition: border-color 0.15s, background 0.15s, transform 0.15s;
    }

    .harness-panel button:hover { border-color: #6ee7b7; background: #1a3740; }
    .harness-panel button:active { transform: translateY(1px); }
    .harness-panel button:disabled { cursor: wait; opacity: 0.55; }

    .harness-section {
      margin-top: 16px;
    }

    .harness-section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 7px;
      color: #b2c4cc;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    .harness-section-heading button {
      border: none;
      padding: 2px 0;
      background: transparent;
      color: #6ee7b7;
      font-size: 11px;
    }

    .harness-section-heading button:hover { background: transparent; color: #a7f3d0; }

    .harness-page-card {
      padding: 11px 12px;
      border: 1px solid #20313b;
      border-radius: 9px;
      background: #101a22;
    }

    .harness-page-title {
      overflow: hidden;
      color: #ecf7fa;
      font-size: 13px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .harness-page-url,
    .harness-snapshot-meta {
      overflow: hidden;
      margin-top: 4px;
      color: #718894;
      font: 10px/1.4 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .harness-task-label {
      display: block;
      margin-top: 16px;
      color: #b2c4cc;
      font-size: 11px;
      font-weight: 600;
    }

    #harness-task {
      display: block;
      width: 100%;
      min-height: 88px;
      margin-top: 7px;
      resize: vertical;
      border: 1px solid #29404a;
      border-radius: 9px;
      padding: 10px 11px;
      outline: none;
      background: #0e171e;
      color: #e5edf5;
      font: 12px/1.55 -apple-system, BlinkMacSystemFont, sans-serif;
    }

    #harness-task::placeholder { color: #5d737e; }
    #harness-task:focus { border-color: #6ee7b7; box-shadow: 0 0 0 3px rgba(110, 231, 183, 0.1); }

    .harness-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 10px;
    }

    .harness-auto-run {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      color: #8ea7b1;
      font-size: 10px;
      line-height: 1.35;
    }

    .harness-auto-run input { accent-color: #6ee7b7; }

    #harness-run {
      flex-shrink: 0;
      border-color: #6ee7b7;
      background: #6ee7b7;
      color: #092019;
      font-weight: 700;
    }

    #harness-run:hover { border-color: #a7f3d0; background: #a7f3d0; }

    .harness-status {
      min-height: 17px;
      margin-top: 8px;
      color: #8ea7b1;
      font-size: 11px;
      line-height: 1.45;
    }

    .harness-status.error { color: #fda4af; }
    .harness-status.success { color: #86efac; }

    .harness-log {
      margin-top: 16px;
      border-top: 1px solid #1d2c34;
      padding-top: 12px;
    }

    .harness-log-title {
      color: #718894;
      font: 10px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .harness-log-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
    }

    .harness-log-item {
      padding: 8px 9px;
      border-left: 2px solid #31515a;
      background: #101a22;
      color: #a8bbc2;
      font-size: 11px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .harness-log-item.action { border-left-color: #6ee7b7; }
    .harness-log-item.error { border-left-color: #fb7185; color: #fda4af; }
    .harness-log-item.result { border-left-color: #60a5fa; }

    .loading {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      z-index: 10;
      transition: opacity 0.3s;
    }

    .loading.hidden { opacity: 0; pointer-events: none; }

    .page-reader {
      position: absolute;
      top: 48px;
      right: 10px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      background: #f8fafc;
      color: #111827;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.18);
      overflow: hidden;
    }

    .page-reader.hidden { display: none; }
    .page-reader:not(.expanded) {
      width: 44px;
      height: 44px;
      border-radius: 999px;
      background: #1a1a2e;
      border-color: rgba(255, 255, 255, 0.18);
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.28);
    }

    .page-reader.expanded {
      width: min(360px, calc(100% - 20px));
      height: min(56%, 460px);
      border-radius: 6px;
    }

    .page-reader-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      height: 38px;
      padding: 0 8px 0 10px;
      border-bottom: 1px solid #d7dde6;
      background: #eef2f7;
      flex-shrink: 0;
    }

    .page-reader:not(.expanded) .page-reader-header {
      width: 100%;
      height: 100%;
      padding: 0;
      border: none;
      background: transparent;
      justify-content: center;
    }

    .page-reader-title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 600;
    }

    .page-reader:not(.expanded) .page-reader-title {
      display: none;
    }

    .page-reader-actions {
      display: flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }

    .page-reader:not(.expanded) .page-reader-actions {
      width: 100%;
      height: 100%;
      justify-content: center;
    }

    .page-reader-actions button {
      width: 26px;
      height: 26px;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: #475569;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page-reader-actions button:hover { background: #dfe6ef; color: #111827; }

    .page-reader:not(.expanded) .page-reader-actions button {
      display: none;
    }

    .page-reader:not(.expanded) #toggle-page-reader {
      display: flex;
      width: 100%;
      height: 100%;
      border-radius: 999px;
      color: #fff;
      font-size: 18px;
    }

    .page-reader:not(.expanded) #toggle-page-reader:hover {
      background: #2a2a4a;
    }

    .page-reader:not(.expanded) .page-reader-meta,
    .page-reader:not(.expanded) #page-reader-content,
    .page-reader:not(.expanded) .page-reader-status {
      display: none;
    }

    .page-reader-meta {
      min-height: 24px;
      padding: 6px 10px;
      border-bottom: 1px solid #e4e9f0;
      color: #64748b;
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex-shrink: 0;
    }

    #page-reader-content {
      flex: 1;
      min-height: 0;
      width: 100%;
      border: none;
      resize: none;
      outline: none;
      padding: 10px;
      background: #fff;
      color: #111827;
      font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .page-reader-status {
      min-height: 26px;
      padding: 6px 10px;
      border-top: 1px solid #e4e9f0;
      color: #64748b;
      font-size: 11px;
      flex-shrink: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #2a2a4a;
      border-top-color: #4a6cf7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="toolbar">
    <div class="app-switcher" id="appSwitcher"></div>
    <div class="zoom-controls">
      <button id="zoom-out" title="缩小 (Ctrl/Cmd + -)">−</button>
      <span id="zoom-label">100%</span>
      <button id="zoom-in" title="放大 (Ctrl/Cmd + +)">+</button>
      <button id="pick-element" title="选择页面元素">⌖</button>
      <button id="refresh" title="刷新页面 (F5)">↻</button>
      <button id="config-btn" title="设置">⚙</button>
    </div>
  </div>
  <div id="webview-container">
    <div class="harness-panel hidden" id="harness-panel">
      <div class="harness-hero">
        <div class="harness-connection">
          <div class="harness-state" id="harness-state">
            <span class="harness-state-dot"></span>
            <span id="harness-state-label">尚未连接</span>
          </div>
          <span class="harness-kicker">local web operator</span>
        </div>
        <div class="harness-bridge-status" id="harness-bridge-status" aria-live="polite"></div>
        <h1>把当前页面交给 DeepSeek</h1>
        <p>扩展通过原生 bridge 读取当前标签页；运行任务时会固定这个标签页。页面内容不会被塞进 DeepSeek 网页输入框，模型按需调用浏览器工具。</p>
        <div class="harness-endpoint-row">
          <code class="harness-endpoint" id="harness-endpoint">http://127.0.0.1:3080</code>
          <button id="harness-open" type="button">打开 Harness ↗</button>
        </div>
      </div>

      <section class="harness-section">
        <div class="harness-section-heading">
          <span>当前标签页</span>
          <button id="harness-refresh-snapshot" type="button">刷新快照</button>
        </div>
        <div class="harness-page-card">
          <div class="harness-page-title" id="harness-page-title">等待读取当前页面</div>
          <div class="harness-page-url" id="harness-page-url"></div>
          <div class="harness-snapshot-meta" id="harness-snapshot-meta"></div>
        </div>
      </section>

      <label class="harness-task-label" for="harness-task">
        网页任务
        <textarea id="harness-task" placeholder="例如：在当前页面搜索“DeepSeek Harness”，打开第一条结果"></textarea>
      </label>
      <div class="harness-controls">
        <label class="harness-auto-run" for="harness-auto-run">
          <input id="harness-auto-run" type="checkbox" checked>
          <span>兼容模式自动执行模型动作</span>
        </label>
        <button id="harness-run" type="button">运行任务</button>
      </div>
      <div class="harness-status" id="harness-status"></div>

      <div class="harness-log">
        <div class="harness-log-title">execution log</div>
        <div class="harness-log-list" id="harness-log-list">
          <div class="harness-log-item">输入任务后，Harness 会通过 browser_* 工具按需读取并操作当前页面。</div>
        </div>
      </div>
    </div>
    <div class="page-reader hidden" id="page-reader">
      <div class="page-reader-header">
        <div class="page-reader-title" id="page-reader-title">当前页面内容</div>
        <div class="page-reader-actions">
          <button id="toggle-page-reader" title="展开/收起">▴</button>
          <button id="copy-page-content" title="复制页面内容">⧉</button>
          <button id="close-page-reader" title="关闭">×</button>
        </div>
      </div>
      <div class="page-reader-meta" id="page-reader-meta"></div>
      <textarea id="page-reader-content" spellcheck="false" readonly></textarea>
      <div class="page-reader-status" id="page-reader-status"></div>
    </div>
    <div class="loading" id="loading">
      <div class="spinner"></div>
    </div>
  </div>
  <script src="harness-protocol.js"></script>
  <script src="harness-extension-transport.js"></script>
  <script src="harness-client.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
