<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>DeepSeek Sidebar</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      background: var(--panel-surface);
    }

    :root {
      --toolbar-height: 30px;
      --toolbar-control-size: 22px;
      --toolbar-action-size: 15px;
      --toolbar-icon-size: 10.5px;
      /* Surface behind the AI iframes. It follows the browser/system theme so the
         blank frame while switching top apps or browser tabs never flashes white. */
      --panel-surface: #ffffff;
      --loading-surface: #1a1a2e;
      color-scheme: light;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --panel-surface: #151517;
        --loading-surface: #151517;
        color-scheme: dark;
      }
    }

    #toolbar {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 3px;
      height: var(--toolbar-height);
      padding: 0 4px;
      background: #1a1a2e;
      border-bottom: 1px solid #16213e;
      flex-shrink: 0;
      user-select: none;
    }

    .app-switcher {
      display: flex;
      align-items: center;
      flex: 1 1 0;
      gap: 1px;
      min-width: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .app-switcher::-webkit-scrollbar { display: none; }

    .app-btn {
      flex: 0 0 var(--toolbar-control-size);
      width: var(--toolbar-control-size);
      height: var(--toolbar-control-size);
      border: 1px solid transparent;
      border-radius: 5px;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, border-color 0.15s;
      padding: 0;
    }

    .app-btn:hover { background: #2a2a4a; }
    .app-btn.active { border-color: rgba(255,255,255,0.5); background: #2a2a4a; }

    .app-btn img {
      width: var(--icon-size, 18px);
      height: var(--icon-size, 18px);
      border-radius: 3px;
      object-fit: contain;
      display: block;
    }

    .app-btn[data-app="qianwen"] img { --icon-size: 17px; }
    .app-btn[data-app="gemini"] img { --icon-size: 19px; }
    .app-btn[data-app="youdao"] img { --icon-size: 18px; }

    .zoom-controls {
      display: flex;
      align-items: center;
      flex: 0 0 auto;
      gap: 0;
    }

    .zoom-controls button {
      flex: 0 0 var(--toolbar-action-size);
      width: var(--toolbar-action-size);
      height: var(--toolbar-action-size);
      border: none;
      border-radius: 3px;
      background: transparent;
      cursor: pointer;
      line-height: 1;
      color: #aaa;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
    }

    /* Every toolbar action shares one icon grid: same --toolbar-icon-size box,
       same 24-unit geometry, same stroke, so no glyph falls back to a font. */
    .zoom-controls button > svg {
      width: var(--toolbar-icon-size);
      height: var(--toolbar-icon-size);
      display: block;
      fill: none;
      stroke: currentColor;
      /* 2.2 at 13px; same optical weight at 10.5px (2.2 * 13 / 10.5). */
      stroke-width: 2.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .zoom-controls button:hover { background: #2a2a4a; color: #fff; }
    .zoom-controls button:active { background: #3a3a5a; }

    #zoom-label {
      font-size: 12px;
      color: #aaa;
      flex: 0 0 30px;
      min-width: 30px;
      height: var(--toolbar-action-size);
      display: flex;
      align-items: center;
      justify-content: center;
      font-variant-numeric: tabular-nums;
    }

    #webview-container {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      position: relative;
      background: var(--panel-surface);
    }

    .webview-frame {
      position: absolute;
      top: 0; left: 0;
      border: none;
      transform-origin: 0 0;
      width: 100%;
      height: 100%;
      background: var(--panel-surface);
      color-scheme: inherit;
      /* visibility handled by JS */
    }

    .webview-frame.hidden { display: none; }

    .harness-page-frame { background: var(--panel-surface); }

    .loading {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--loading-surface);
      z-index: 10;
      transition: opacity 0.3s;
    }

    .loading.hidden { opacity: 0; pointer-events: none; }

    .page-reader {
      position: absolute;
      top: calc(var(--toolbar-height) + 10px);
      right: 10px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      background: #f8fafc;
      color: #111827;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.18);
      overflow: hidden;
    }

    .page-reader.hidden { display: none; }
    .page-reader:not(.expanded) {
      width: 44px;
      height: 44px;
      border-radius: 999px;
      background: #1a1a2e;
      border-color: rgba(255, 255, 255, 0.18);
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.28);
    }

    .page-reader.expanded {
      width: min(360px, calc(100% - 20px));
      height: min(56%, 460px);
      border-radius: 6px;
    }

    .page-reader-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      height: 38px;
      padding: 0 8px 0 10px;
      border-bottom: 1px solid #d7dde6;
      background: #eef2f7;
      flex-shrink: 0;
    }

    .page-reader:not(.expanded) .page-reader-header {
      width: 100%;
      height: 100%;
      padding: 0;
      border: none;
      background: transparent;
      justify-content: center;
    }

    .page-reader-title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 600;
    }

    .page-reader:not(.expanded) .page-reader-title {
      display: none;
    }

    .page-reader-actions {
      display: flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }

    .page-reader:not(.expanded) .page-reader-actions {
      width: 100%;
      height: 100%;
      justify-content: center;
    }

    .page-reader-actions button {
      width: 26px;
      height: 26px;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: #475569;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page-reader-actions button:hover { background: #dfe6ef; color: #111827; }

    .page-reader:not(.expanded) .page-reader-actions button {
      display: none;
    }

    .page-reader:not(.expanded) #toggle-page-reader {
      display: flex;
      width: 100%;
      height: 100%;
      border-radius: 999px;
      color: #fff;
      font-size: 18px;
    }

    .page-reader:not(.expanded) #toggle-page-reader:hover {
      background: #2a2a4a;
    }

    .page-reader:not(.expanded) .page-reader-meta,
    .page-reader:not(.expanded) #page-reader-content,
    .page-reader:not(.expanded) .page-reader-status {
      display: none;
    }

    .page-reader-meta {
      min-height: 24px;
      padding: 6px 10px;
      border-bottom: 1px solid #e4e9f0;
      color: #64748b;
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex-shrink: 0;
    }

    #page-reader-content {
      flex: 1;
      min-height: 0;
      width: 100%;
      border: none;
      resize: none;
      outline: none;
      padding: 10px;
      background: #fff;
      color: #111827;
      font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .page-reader-status {
      min-height: 26px;
      padding: 6px 10px;
      border-top: 1px solid #e4e9f0;
      color: #64748b;
      font-size: 11px;
      flex-shrink: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #2a2a4a;
      border-top-color: #4a6cf7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="toolbar">
    <div class="app-switcher" id="appSwitcher"></div>
    <div class="zoom-controls">
      <button id="zoom-out" title="缩小 (Ctrl/Cmd + -)" aria-label="缩小">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
      </button>
      <span id="zoom-label">100%</span>
      <button id="zoom-in" title="放大 (Ctrl/Cmd + +)" aria-label="放大">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
      </button>
      <button id="pick-element" title="选择页面元素" aria-label="选择页面元素">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6.5"/><path d="M12 2v3.5"/><path d="M12 18.5V22"/><path d="M2 12h3.5"/><path d="M18.5 12H22"/></svg>
      </button>
      <button id="refresh" title="刷新页面 (F5)" aria-label="刷新页面">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
      </button>
      <button id="multi-ai-btn" title="全屏多 AI 对比" aria-label="全屏多 AI 对比">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 20v-6"/><path d="M12 20V4"/><path d="M18 20v-9"/></svg>
      </button>
      <button id="config-btn" title="设置" aria-label="设置">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
  </div>
  <div id="webview-container">
    <div class="page-reader hidden" id="page-reader">
      <div class="page-reader-header">
        <div class="page-reader-title" id="page-reader-title">当前页面内容</div>
        <div class="page-reader-actions">
          <button id="toggle-page-reader" title="展开/收起">▴</button>
          <button id="copy-page-content" title="复制页面内容">⧉</button>
          <button id="close-page-reader" title="关闭">×</button>
        </div>
      </div>
      <div class="page-reader-meta" id="page-reader-meta"></div>
      <textarea id="page-reader-content" spellcheck="false" readonly></textarea>
      <div class="page-reader-status" id="page-reader-status"></div>
    </div>
    <div class="loading" id="loading">
      <div class="spinner"></div>
    </div>
  </div>
  <script src="harness-protocol.js"></script>
  <script src="tab-state.js"></script>
  <script src="sidepanel-context.js"></script>
  <script src="app-catalog.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
