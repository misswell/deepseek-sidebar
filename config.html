<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeepSeek Sidebar 设置</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      padding: 24px 20px;
      max-width: 520px;
      margin: 0 auto;
    }
    h1 {
      font-size: 18px;
      margin-bottom: 6px;
      color: #fff;
    }
    .subtitle {
      font-size: 13px;
      color: #888;
      margin-bottom: 20px;
    }
    .app-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .app-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: #2a2a4a;
      border: 1px solid #333366;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .app-item.dragging {
      opacity: 0.4;
    }
    .app-item.drag-over {
      border-color: #4a6cf7;
      border-style: dashed;
      background: #252550;
    }
    .drag-handle {
      width: 20px;
      height: 24px;
      flex-shrink: 0;
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      font-size: 16px;
      user-select: none;
    }
    .drag-handle:active { cursor: grabbing; }
    .app-item:hover { background: #33335a; border-color: #4a4a7a; }
    .app-item.disabled { opacity: 0.5; }
    .app-icon {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      object-fit: contain;
      flex-shrink: 0;
    }
    .app-name {
      flex: 1;
      font-size: 14px;
    }
    .app-url {
      font-size: 11px;
      color: #888;
    }
    .checkbox {
      width: 18px;
      height: 18px;
      border: 2px solid #555;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.15s;
    }
    .app-item.checked .checkbox {
      background: #4a6cf7;
      border-color: #4a6cf7;
    }
    .app-item.checked .checkbox::after {
      content: '✓';
      color: #fff;
      font-size: 12px;
      font-weight: bold;
    }
    .save-bar {
      margin-top: 20px;
      display: flex;
      gap: 8px;
    }
    button {
      padding: 8px 20px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s;
    }
    .btn-save { background: #4a6cf7; color: #fff; }
    .btn-save:hover { background: #3a5ce7; }
    .btn-reset { background: #333366; color: #ccc; }
    .btn-reset:hover { background: #3a3a6a; }
    .status {
      font-size: 12px;
      color: #4a6cf7;
      margin-top: 10px;
      min-height: 16px;
    }

    .harness-settings {
      margin: 0 0 22px;
      border: 1px solid #28524d;
      border-radius: 12px;
      padding: 16px;
      background:
        radial-gradient(circle at 96% 0, rgba(110, 231, 183, 0.15), transparent 32%),
        #14242b;
      box-shadow: 0 14px 28px rgba(4, 8, 18, 0.22);
    }

    .harness-heading {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .harness-signal {
      width: 10px;
      height: 10px;
      flex-shrink: 0;
      margin-top: 4px;
      border-radius: 50%;
      background: #6ee7b7;
      box-shadow: 0 0 0 5px rgba(110, 231, 183, 0.12);
    }

    .harness-heading h2 {
      color: #f1fffb;
      font-size: 15px;
      letter-spacing: -0.02em;
    }

    .harness-heading p {
      margin-top: 4px;
      color: #9eb7b7;
      font-size: 12px;
      line-height: 1.45;
    }

    .harness-label {
      display: block;
      margin-top: 15px;
      color: #c0d7d1;
      font-size: 12px;
      font-weight: 600;
    }

    .harness-endpoint-row {
      display: flex;
      gap: 8px;
      margin-top: 7px;
    }

    #harnessUrl,
    #harnessToken {
      min-width: 0;
      flex: 1;
      border: 1px solid #37645d;
      border-radius: 7px;
      padding: 9px 10px;
      outline: none;
      background: #0f1b21;
      color: #e6fff7;
      font: 12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    #harnessUrl:focus,
    #harnessToken:focus {
      border-color: #6ee7b7;
      box-shadow: 0 0 0 3px rgba(110, 231, 183, 0.1);
    }

    .harness-token-row {
      display: flex;
      margin-top: 7px;
    }

    .btn-test {
      flex-shrink: 0;
      padding: 8px 11px;
      background: #6ee7b7;
      color: #092019;
      font-size: 12px;
      font-weight: 700;
    }

    .btn-test:hover { background: #a7f3d0; }

    .harness-hint {
      margin-top: 8px;
      color: #789590;
      font-size: 11px;
      line-height: 1.45;
    }

    .harness-status {
      min-height: 17px;
      margin-top: 9px;
      color: #86efac;
      font-size: 12px;
      line-height: 1.4;
    }

    .harness-status.error { color: #fda4af; }
  </style>
</head>
<body>
  <h1>顶部栏显示设置</h1>
  <p class="subtitle">勾选要在侧边栏顶部显示的网站</p>
  <section class="harness-settings">
    <div class="harness-heading">
      <span class="harness-signal"></span>
      <div>
        <h2>DeepSeek Harness 网页代理</h2>
        <p>连接本机或局域网里的 Harness，让它读取并操作当前 Chrome 标签页。</p>
      </div>
    </div>
    <label class="harness-label" for="harnessUrl">服务地址</label>
    <div class="harness-endpoint-row">
      <input id="harnessUrl" type="url" inputmode="url" spellcheck="false" placeholder="http://127.0.0.1:3080/">
      <button class="btn-test" id="testHarnessBtn" type="button">测试连接</button>
    </div>
    <label class="harness-label" for="harnessToken">Bridge token（可选）</label>
    <div class="harness-token-row">
      <input id="harnessToken" type="password" autocomplete="off" spellcheck="false" placeholder="本机 Chrome 通常可留空">
    </div>
    <p class="harness-hint">默认地址为 http://127.0.0.1:3080/。本机 Chrome bridge 通常无需 token；远程或 Firefox bridge 请填入服务端 token。页面内容只通过原生 bridge 的浏览器工具按需读取。</p>
    <div class="harness-status" id="harnessStatus"></div>
  </section>
  <div class="app-list" id="appList"></div>
  <div class="save-bar">
    <button class="btn-save" id="saveBtn">保存</button>
    <button class="btn-reset" id="resetBtn">恢复默认</button>
  </div>
  <div class="status" id="status"></div>
  <script src="harness-protocol.js"></script>
  <script src="harness-extension-transport.js"></script>
  <script src="harness-client.js"></script>
  <script src="config.js"></script>
</body>
</html>
